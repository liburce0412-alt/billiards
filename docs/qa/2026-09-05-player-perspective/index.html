<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Break Builder · 球手避让与第一视角</title><style>*{box-sizing:border-box}body{background:#101720;color:#e7eff4;margin:0;font:16px/1.6 system-ui,sans-serif}main{max-width:1180px;padding:36px 24px;margin:auto}h1{font-size:32px;line-height:1.3}header{padding-bottom:24px;border-bottom:1px solid #344453;margin-bottom:28px}p{color:#b2c3cf}a{color:#8de2e9}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0;background:#1a2530;border:1px solid #344453;border-radius:12px;overflow:hidden}figure:last-child{grid-column:1/-1;max-width:915px}img{display:block;width:100%;height:auto}figcaption{padding:18px}figcaption p{margin:8px 0;font-size:14px}footer{margin-top:32px;font-size:14px}@media(max-width:760px){.grid{grid-template-columns:1fr}main{padding:24px 14px}}</style><main><header><small>BREAK BUILDER · 260905.23</small><h1>球手避让 · 第一视角起身</h1><p>根据 22:33 的两张截图修正。下方为浏览器实际游戏画面，点击查看原图。</p><a href="https://play.campus3ai.xyz/play">打开正式游戏 ↗</a></header><div class="grid"><figure><a href="avoidance.png"><img src="avoidance.png" alt="站位避让"></a><figcaption><b>站位避让</b><p>击球球手优先占位，待机球手换位并沿外侧让行。</p></figcaption></figure><figure><a href="eyes-aim.png"><img src="eyes-aim.png" alt="第一视角瞄准"></a><figcaption><b>第一视角瞄准</b><p>自动 3D 镜头以当前球手的眼睛为观察位置。</p></figcaption></figure><figure><a href="eyes-standing.png"><img src="eyes-standing.png" alt="第一视角起身"></a><figcaption><b>第一视角起身</b><p>先保留出杆停顿，再随眼睛抬高；自身头部和胸甲不会遮挡球桌。</p></figcaption></figure><figure><a href="walking.png"><img src="walking.png" alt="第三视角走位"></a><figcaption><b>第三视角走位</b><p>开始移动后镜头退开，同时看到球手和球桌；就位后平滑回到眼睛位置。</p></figcaption></figure><figure><a href="thumb.png"><img src="thumb.png" alt="拇指与手腕"></a><figcaption><b>拇指与手腕</b><p>拇指分节弯曲、从球杆侧下方支撑。手腕接到手掌后方，避免包住球杆。</p></figcaption></figure></div><footer><p>819 项单元测试、13 项相关浏览器回归通过。手机采用触控模拟验证，未进行真机帧率和手感验收。</p><a href="README.md">验证记录</a> · <a href="browser-evidence.
