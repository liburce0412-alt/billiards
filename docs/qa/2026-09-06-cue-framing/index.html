  <main>
    <h1>库边也能看清母球与球杆</h1>
    <p>2026-09-06 · 实际 WebGL 截图。瞄准眼位对齐母球与出杆轴线，避免沿用库边脚位导致镜头越过母球。出杆停留 1 秒后起身，等待新方向稳定时保持站立。</p>
    <figure><img src="desktop-aim.png" alt="桌面端，母球靠库时仍能看到母球与杆头" /><figcaption>桌面端库边瞄准：母球与杆头保持在画面下半部。</figcaption></figure>
    <figure><img src="desktop-stroke.png" alt="桌面端，击球后球杆仍在画面中" /><figcaption>击球后保持原视角，球杆仍可见，母球开始向前运动。</figcaption></figure>
    <figure><img src="touch-aim.png" alt="手机横屏模拟中的库边瞄准" /><figcaption>915 × 412 手机横屏触控模拟；另验证了触控拉条出杆。</figcaption></figure>
    <figure><img src="touch-stroke.png" alt="手机横屏触控出杆后保持原视角" /><figcaption>手机横屏出杆后的停留画面。</figcaption></figure>
    <p>835 项单元测试、16 项浏览器回归通过。覆盖 9 组球位与角度，以及 30 / 60 / 120 FPS 的停留和站立流程。尚未进行手机真机验收。</p>
